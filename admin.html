<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>ZISHU TRON Admin Panel</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f8fafc;
      color: #0b1a2f;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.dark {
      background: #0f172a;
      color: #e8edf5;
    }
    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #eef3f9;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    body.dark .admin-header {
      border-bottom-color: #2e405b;
    }
    .admin-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0b1a2f, #1e3b5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    body.dark .admin-header h1 {
      background: linear-gradient(135deg, #d6e4ff, #a0c0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .admin-header .back-link {
      color: #2b6b9e;
      text-decoration: none;
      font-weight: 500;
    }
    .admin-header .back-link:hover {
      text-decoration: underline;
    }
    .admin-panel {
      background: white;
      border-radius: 24px;
      padding: 30px;
      border: 1px solid #eef3f9;
    }
    body.dark .admin-panel {
      background: #1a263b;
      border-color: #2e405b;
    }
    .admin-panel h2 {
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid #d0ddee;
      font-size: 1rem;
      background: #f8fafc;
      color: inherit;
    }
    body.dark .field input,
    body.dark .field textarea {
      background: #0f172a;
      border-color: #3d5478;
      color: #e8edf5;
    }
    .field textarea {
      min-height: 120px;
      resize: vertical;
    }
    .char-counter {
      font-size: 0.8rem;
      color: #4a5f7a;
      text-align: right;
      margin-top: 2px;
    }
    .admin-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .btn-primary {
      background: #0b1a2f;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.15s;
    }
    body.dark .btn-primary {
      background: #d6e4ff;
      color: #0b1a2f;
    }
    .btn-primary:hover {
      opacity: 0.85;
    }
    .btn-danger {
      background: #b13e3e;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger:hover {
      background: #8f2e2e;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid #b0c4dd;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: #eef3fa;
    }
    .btn-success {
      background: #1c6b3b;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-success:hover {
      background: #14522d;
    }
    .admin-post-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #eef3f9;
      flex-wrap: wrap;
      gap: 8px;
    }
    body.dark .admin-post-item {
      border-bottom-color: #2e405b;
    }
    .admin-post-item .title {
      font-weight: 600;
      flex: 1;
    }
    .admin-post-item .actions {
      display: flex;
      gap: 8px;
    }
    .admin-post-item .actions button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .admin-post-item .actions .edit-btn {
      color: #2b6b9e;
    }
    .admin-post-item .actions .edit-btn:hover {
      background: #2b6b9e20;
    }
    .admin-post-item .actions .delete-btn {
      color: #b13e3e;
    }
    .admin-post-item .actions .delete-btn:hover {
      background: #b13e3e20;
    }
    .empty-state {
      padding: 40px 0;
      text-align: center;
      color: #4a5f7a;
    }
    .empty-state h4 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .hidden {
      display: none !important;
    }
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #0b1a2f;
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      max-width: 90%;
      text-align: center;
    }
    body.dark .toast {
      background: #d6e4ff;
      color: #0b1a2f;
    }
    .login-box {
      padding: 30px 20px;
      text-align: center;
      max-width: 400px;
      margin: 0 auto;
    }
    .login-box h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    .login-box .field {
      text-align: left;
    }
    .login-box .field input {
      width: 100%;
    }
    .login-box .btn-primary {
      width: 100%;
      margin-top: 8px;
    }
    .login-error {
      color: #b13e3e;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .authorized-badge {
      color: #1c6b3b;
      font-weight: 600;
    }
    hr {
      margin: 24px 0;
      border-color: #eef3f9;
    }
    body.dark hr {
      border-color: #2e405b;
    }
    @media (max-width: 720px) {
      .admin-panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <h1>⚙️ ZISHU TRON Admin</h1>
      <a href="/zishu-insight/" class="back-link">← Back to Insights</a>
    </div>
    <div class="admin-panel" id="adminPanel">
      <!-- Login Area -->
      <div id="adminLoginArea">
        <div class="login-box">
          <h2>Admin Login</h2>
          <div class="field">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Enter username" />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password" />
          </div>
          <button class="btn-primary" id="loginBtn">Login</button>
          <div id="loginError" class="login-error hidden"></div>
        </div>
      </div>

      <!-- Admin Content -->
      <div id="adminContent" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
          <h2>Manage Articles</h2>
          <button class="btn-ghost" id="logoutBtn">Logout</button>
        </div>
        <div class="field">
          <label>Title</label>
          <input id="adminTitle" maxlength="150" placeholder="Enter article title" />
          <div class="char-counter" id="adminTitleCounter">0 / 150</div>
        </div>
        <div class="field">
          <label>Content</label>
          <textarea id="adminContentText" maxlength="50000" placeholder="Write your update here..."></textarea>
          <div class="char-counter" id="adminContentCounter">0 / 50000</div>
        </div>
        <div class="admin-actions">
          <button class="btn-primary" id="adminPublishBtn">Publish Article</button>
          <button class="btn-ghost" id="adminCancelEditBtn" style="display:none;">Cancel Edit</button>
        </div>
        <hr />
        <h3 style="margin-bottom:12px;">Your Published Articles</h3>
        <div id="adminPostsList"></div>
        <div id="adminEmptyPosts" class="empty-state hidden" style="padding:20px 0;"><h4>No articles published yet.</h4></div>
      </div>
    </div>
  </div>
  <div id="toastContainer" class="toast hidden"></div>

  <script>
    (function() {
      const firebaseConfig = {
        apiKey: "AIzaSyAL0FSX7YfhQ-IoqE3a7axcLjgN7cPySM0",
        authDomain: "stardust-official.firebaseapp.com",
        databaseURL: "https://stardust-official-default-rtdb.firebaseio.com",
        projectId: "stardust-official",
        storageBucket: "stardust-official.firebasestorage.app",
        messagingSenderId: "1065835601050",
        appId: "1:1065835601050:web:56d326d89b1efb52f45323",
        measurementId: "G-X552DVRG7K"
      };
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.database();

      // ADMIN CREDENTIALS
      const ADMIN_USERNAME = "admin786";
      const ADMIN_PASSWORD = "zishuadmin";

      let currentUser = null;
      let isAdmin = false;
      let allPosts = [];
      let editingPostId = null;

      const $ = (s) => document.querySelector(s);
      const toastContainer = $('#toastContainer');
      const adminLoginArea = $('#adminLoginArea');
      const adminContent = $('#adminContent');
      const adminTitle = $('#adminTitle');
      const adminContentText = $('#adminContentText');
      const adminTitleCounter = $('#adminTitleCounter');
      const adminContentCounter = $('#adminContentCounter');
      const adminPublishBtn = $('#adminPublishBtn');
      const adminCancelEditBtn = $('#adminCancelEditBtn');
      const adminPostsList = $('#adminPostsList');
      const adminEmptyPosts = $('#adminEmptyPosts');
      const loginUsername = $('#loginUsername');
      const loginPassword = $('#loginPassword');
      const loginBtn = $('#loginBtn');
      const loginError = $('#loginError');
      const logoutBtn = $('#logoutBtn');

      function showToast(msg) {
        toastContainer.textContent = msg;
        toastContainer.classList.remove('hidden');
        setTimeout(() => toastContainer.classList.add('hidden'), 4000);
      }

      function renderAdminPosts() {
        if (!isAdmin) return;
        const userPosts = allPosts.filter(p => p.authorId === 'admin786');
        if (userPosts.length === 0) {
          adminPostsList.innerHTML = '';
          adminEmptyPosts.classList.remove('hidden');
          return;
        }
        adminEmptyPosts.classList.add('hidden');
        adminPostsList.innerHTML = userPosts.map(p => `
          <div class="admin-post-item" data-id="${p.id}">
            <span class="title">${p.title || 'Untitled'}</span>
            <span style="font-size:0.8rem;color:#4a5f7a;">${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : ''}</span>
            <div class="actions">
              <button class="edit-btn" data-id="${p.id}">Edit</button>
              <button class="delete-btn" data-id="${p.id}">Delete</button>
            </div>
          </div>
        `).join('');
      }

      function loadPosts() {
        const ref = db.ref('posts').orderByChild('createdAt').limitToLast(50);
        ref.on('value', (snap) => {
          const data = snap.val();
          if (!data) { allPosts = []; return; }
          allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          renderAdminPosts();
        });
      }

      function resetAdminForm() {
        adminTitle.value = '';
        adminContentText.value = '';
        adminTitleCounter.textContent = '0 / 150';
        adminContentCounter.textContent = '0 / 50000';
        editingPostId = null;
        adminPublishBtn.textContent = 'Publish Article';
        adminCancelEditBtn.style.display = 'none';
      }

      function publishPost() {
        const title = adminTitle.value.trim();
        const content = adminContentText.value.trim();
        if (title.length < 3) { showToast('Title must be at least 3 characters.'); return; }
        if (content.length < 10) { showToast('Content must be at least 10 characters.'); return; }
        if (!isAdmin) { showToast('Please login as admin.'); return; }

        const data = {
          title: title,
          content: content,
          authorId: 'admin786',
          authorName: 'ZISHU TRON Admin',
          updatedAt: Date.now()
        };

        if (editingPostId) {
          db.ref('posts/' + editingPostId).update(data).then(() => {
            showToast('Article updated.');
            resetAdminForm();
            renderAdminPosts();
          }).catch(() => showToast('Error updating.'));
        } else {
          data.createdAt = Date.now();
          db.ref('posts').push(data).then(() => {
            showToast('Article published successfully.');
            resetAdminForm();
            renderAdminPosts();
          }).catch(() => showToast('Error publishing.'));
        }
      }

      function loadPostForEdit(postId) {
        const post = allPosts.find(p => p.id === postId);
        if (!post) return;
        if (post.authorId !== 'admin786') { showToast('You can only edit your own posts.'); return; }
        adminTitle.value = post.title || '';
        adminContentText.value = post.content || '';
        adminTitleCounter.textContent = `${post.title?.length || 0} / 150`;
        adminContentCounter.textContent = `${post.content?.length || 0} / 50000`;
        editingPostId = postId;
        adminPublishBtn.textContent = 'Save Changes';
        adminCancelEditBtn.style.display = 'inline-block';
        adminTitle.scrollIntoView({ behavior: 'smooth' });
      }

      function deletePost(postId) {
        if (!confirm('Delete this article permanently?')) return;
        const post = allPosts.find(p => p.id === postId);
        if (!post) return;
        if (post.authorId !== 'admin786') { showToast('You can only delete your own posts.'); return; }
        db.ref('posts/' + postId).remove().then(() => {
          showToast('Article deleted.');
          renderAdminPosts();
          if (editingPostId === postId) resetAdminForm();
        }).catch(() => showToast('Error deleting.'));
      }

      function handleLogin() {
        const username = loginUsername.value.trim();
        const password = loginPassword.value.trim();

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
          isAdmin = true;
          loginError.classList.add('hidden');
          adminLoginArea.innerHTML = `<p style="text-align:center;padding:10px 0;"><span class="authorized-badge">✓ Logged in as Admin</span></p>`;
          adminContent.classList.remove('hidden');
          loadPosts();
          renderAdminPosts();
          showToast('Welcome Admin!');
        } else {
          loginError.textContent = 'Invalid username or password.';
          loginError.classList.remove('hidden');
        }
      }

      function handleLogout() {
        isAdmin = false;
        editingPostId = null;
        adminContent.classList.add('hidden');
        adminLoginArea.innerHTML = `
          <div class="login-box">
            <h2>Admin Login</h2>
            <div class="field">
              <label>Username</label>
              <input type="text" id="loginUsername" placeholder="Enter username" />
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="loginPassword" placeholder="Enter password" />
            </div>
            <button class="btn-primary" id="loginBtn">Login</button>
            <div id="loginError" class="login-error hidden"></div>
          </div>
        `;
        // Re-bind events
        document.getElementById('loginBtn')?.addEventListener('click', handleLogin);
        document.getElementById('loginPassword')?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('loginUsername')?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') document.getElementById('loginPassword')?.focus();
        });
        resetAdminForm();
        showToast('Logged out.');
      }

      // Login events
      loginBtn?.addEventListener('click', handleLogin);
      loginPassword?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
      loginUsername?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loginPassword?.focus();
      });

      logoutBtn?.addEventListener('click', handleLogout);

      // Form events
      adminTitle?.addEventListener('input', () => {
        adminTitleCounter.textContent = `${adminTitle.value.length} / 150`;
      });
      adminContentText?.addEventListener('input', () => {
        adminContentCounter.textContent = `${adminContentText.value.length} / 50000`;
      });

      adminPublishBtn?.addEventListener('click', publishPost);
      adminCancelEditBtn?.addEventListener('click', resetAdminForm);

      // Delegated events for admin post actions
      document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-id]');
        if (!target) return;
        const id = target.dataset.id;
        if (target.classList.contains('edit-btn')) {
          loadPostForEdit(id);
        }
        if (target.classList.contains('delete-btn')) {
          deletePost(id);
        }
      });

      // Initial load
      loadPosts();
    })();
  </script>
</body>
</html>
