<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>ZISHU TRON INSIGHT — Official Updates</title>
  <meta name="description" content="Official news, announcements and product updates from ZISHU TRON." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ----- RESET & VARIABLES ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-hero: #f1f5f9;
      --text: #0b1a2a;
      --text-muted: #475569;
      --text-light: #94a3b8;
      --border: rgba(11, 26, 42, 0.06);
      --border-card: rgba(11, 26, 42, 0.04);
      --accent: #1e3a5f;
      --accent-light: #2563eb;
      --shadow: 0 4px 24px rgba(0,0,0,0.02);
      --radius: 16px;
      --transition: 0.2s ease;
      --font: 'Inter', -apple-system, system-ui, sans-serif;
    }
    .dark {
      --bg: #080b12;
      --bg-card: #0f172a;
      --bg-card-hover: #1a2338;
      --bg-hero: #0b111e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #475569;
      --border: rgba(255,255,255,0.04);
      --border-card: rgba(255,255,255,0.04);
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --accent: #4b7bec;
      --accent-light: #6b8cff;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

    /* ----- HEADER ----- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s, border 0.3s;
    }
    .dark header { background: rgba(8,11,18,0.8); }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .brand-main { color: var(--text); }
    .brand-insight { color: var(--accent-light); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.08em; margin-left: 2px; }
    .brand-sub { display: block; font-size: 0.55rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0.12em; margin-top: -2px; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .nav-links a { transition: color 0.15s; position: relative; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); }
    .nav-links a.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: var(--accent-light); border-radius: 2px; }
    .header-actions { display: flex; align-items: center; gap: 0.8rem; }
    .header-actions button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 8px;
      transition: 0.15s;
      display: flex;
      align-items: center;
    }
    .header-actions button:hover { background: var(--bg-card-hover); color: var(--text); }
    .header-actions svg { width: 20px; height: 20px; }

    /* Mobile nav toggle */
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 6px; color: var(--text); }
    .nav-toggle svg { width: 24px; height: 24px; }

    /* ----- HERO / INTRO ----- */
    .hero-intro {
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-hero);
      transition: background 0.3s;
    }
    .hero-intro .container { display: flex; flex-direction: column; gap: 0.3rem; }
    .hero-intro .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-light);
      font-weight: 600;
    }
    .hero-intro h1 {
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .hero-intro h1 span { color: var(--accent-light); }
    .hero-intro p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin-top: 0.2rem;
    }
    .hero-intro .meta-badge {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-light);
      font-weight: 500;
    }

    /* ----- FEATURED ARTICLE ----- */
    .featured-section {
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .featured-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 2rem;
      border: 1px solid var(--border-card);
      transition: background 0.3s, border 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .featured-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-light), #8b5cf6);
      opacity: 0.3;
    }
    .featured-card .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-light);
      font-weight: 600;
    }
    .featured-card h2 {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0.4rem 0 0.3rem;
      line-height: 1.2;
      cursor: pointer;
    }
    .featured-card h2:hover { color: var(--accent-light); }
    .featured-card .excerpt {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 640px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .featured-card .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .featured-card .meta svg { width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; }
    .featured-card .meta span { display: inline-flex; align-items: center; }
    .featured-card .read-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--accent-light);
      margin-top: 1rem;
      transition: gap 0.2s;
      cursor: pointer;
    }
    .featured-card .read-link:hover { gap: 12px; }
    .featured-card .read-link svg { width: 16px; height: 16px; transition: transform 0.2s; }
    .featured-card .read-link:hover svg { transform: translateX(4px); }

    /* ----- LATEST UPDATES GRID ----- */
    .updates-section {
      padding: 2rem 0 1rem;
    }
    .updates-section .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .updates-section .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .articles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }

    /* ----- ARTICLE CARD (minimal) ----- */
    .article-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.4rem 1.6rem;
      border: 1px solid var(--border-card);
      transition: background 0.2s, border 0.2s, transform 0.15s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .article-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      border-color: var(--accent-light);
    }
    .article-card .card-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-light);
      font-weight: 600;
    }
    .article-card .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .article-card .card-excerpt {
      color: var(--text-muted);
      font-size: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      font-size: 0.7rem;
      color: var(--text-light);
      margin-top: 0.2rem;
    }
    .article-card .card-meta svg { width: 12px; height: 12px; vertical-align: middle; margin-right: 3px; }
    .article-card .card-read {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-light);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.3rem;
      transition: gap 0.2s;
    }
    .article-card .card-read:hover { gap: 10px; }
    .article-card .card-read svg { width: 14px; height: 14px; transition: transform 0.2s; }
    .article-card .card-read:hover svg { transform: translateX(3px); }

    /* ----- SKELETON ----- */
    .skeleton {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.4rem 1.6rem;
      border: 1px solid var(--border-card);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton .line { height: 12px; background: var(--border); border-radius: 4px; margin-bottom: 8px; }
    .skeleton .line.short { width: 40%; }
    .skeleton .line.medium { width: 70%; }
    .skeleton .line.long { width: 90%; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* ----- EMPTY STATE ----- */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state h3 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text); }
    .empty-state p { font-size: 0.95rem; }

    /* ----- ARTICLE DETAIL (full view) ----- */
    .article-detail {
      padding: 2rem 0 4rem;
      max-width: 780px;
      margin: 0 auto;
    }
    .article-detail .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .article-detail .back-link:hover { color: var(--text); }
    .article-detail .detail-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-light);
      font-weight: 600;
    }
    .article-detail h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0.3rem 0 0.5rem;
    }
    .article-detail .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .article-detail .detail-meta svg { width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; }
    .article-detail .detail-content {
      font-size: clamp(1rem, 1.1vw, 1.125rem);
      line-height: 1.8;
      color: var(--text);
    }
    .article-detail .detail-content p { margin-bottom: 1.2rem; }
    .article-detail .detail-content h2, .article-detail .detail-content h3 { margin: 1.5rem 0 0.5rem; }
    .article-detail .detail-content ul, .article-detail .detail-content ol { margin: 0.5rem 0 1rem 1.5rem; }
    .article-detail .detail-content li { margin-bottom: 0.3rem; }
    .more-articles {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .more-articles h4 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .more-articles .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .more-articles .mini-card {
      background: var(--bg-card);
      padding: 1rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      cursor: pointer;
      transition: 0.15s;
    }
    .more-articles .mini-card:hover { background: var(--bg-card-hover); }
    .more-articles .mini-card .mini-title { font-weight: 600; font-size: 0.9rem; }
    .more-articles .mini-card .mini-meta { font-size: 0.7rem; color: var(--text-light); }

    /* ----- SEARCH OVERLAY ----- */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
    }
    .search-overlay.open { display: flex; }
    .search-modal {
      background: var(--bg-card);
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      padding: 1.5rem;
      box-shadow: 0 24px 80px rgba(0,0,0,0.2);
      max-height: 70vh;
      overflow-y: auto;
    }
    .search-modal input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 40px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      outline: none;
      transition: border 0.15s;
    }
    .search-modal input:focus { border-color: var(--accent-light); }
    .search-modal .search-results { margin-top: 1.2rem; }
    .search-modal .result-item {
      padding: 0.8rem 0.6rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: 0.1s;
    }
    .search-modal .result-item:hover { background: var(--bg-card-hover); border-radius: 8px; }
    .search-modal .result-item .r-title { font-weight: 600; font-size: 0.95rem; }
    .search-modal .result-item .r-meta { font-size: 0.7rem; color: var(--text-muted); }
    .search-modal .no-result { text-align: center; padding: 2rem 0; color: var(--text-muted); }

    /* ----- MOBILE BOTTOM NAV ----- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0 0.7rem;
      z-index: 50;
      transition: background 0.3s, border 0.3s;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.55rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      transition: 0.15s;
      font-family: var(--font);
    }
    .bottom-nav .nav-item.active { color: var(--accent-light); background: var(--bg-card-hover); }
    .bottom-nav .nav-item svg { width: 22px; height: 22px; }
    .bottom-nav .nav-item span { font-weight: 500; letter-spacing: 0.02em; }

    /* ----- FOOTER ----- */
    footer {
      padding: 2rem 0 1rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
      background: var(--bg);
      transition: background 0.3s;
    }
    footer .footer-inner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer .footer-brand { font-weight: 600; color: var(--text); font-size: 1rem; }
    footer .footer-brand small { font-weight: 400; color: var(--text-muted); font-size: 0.75rem; margin-left: 6px; }

    /* ----- RESPONSIVE ----- */
    @media (min-width: 768px) {
      .articles-grid { grid-template-columns: 1fr 1fr; }
      .more-articles .mini-grid { grid-template-columns: 1fr 1fr 1fr; }
      .bottom-nav { display: none; }
      body { padding-bottom: 0; }
      .nav-toggle { display: none; }
    }
    @media (max-width: 767px) {
      .nav-links { display: none; }
      .nav-toggle { display: block; }
      .nav-links.mobile-open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        background: var(--bg-card);
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        gap: 1.2rem;
        backdrop-filter: blur(16px);
      }
      .featured-card { padding: 1.5rem; }
      .article-card { padding: 1.2rem; }
      .header-inner { padding: 0 1rem; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 1rem; }
      .featured-card .meta { gap: 0.6rem; font-size: 0.7rem; }
      .more-articles .mini-grid { grid-template-columns: 1fr; }
    }

    /* ----- UTILITY ----- */
    .hidden { display: none !important; }
    .flex { display: flex; align-items: center; gap: 0.5rem; }
    .gap-1 { gap: 0.5rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .text-accent { color: var(--accent-light); }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 0.8rem; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="brand">
      <div>
        <span class="brand-main">ZISHU TRON</span>
        <span class="brand-insight">INSIGHT</span>
        <span class="brand-sub">OFFICIAL UPDATES</span>
      </div>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="#" class="active" data-view="home">Home</a>
      <a href="#" data-view="latest">Latest</a>
      <a href="#" id="searchToggleNav">Search</a>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- MAIN CONTENT -->
<main id="app">

  <!-- HERO INTRO -->
  <section class="hero-intro">
    <div class="container">
      <div class="label">ZISHU TRON INSIGHT</div>
      <h1>Official updates from <span>ZISHU TRON</span></h1>
      <p>News, announcements and product updates from the ZISHU TRON team.</p>
      <div class="meta-badge">OFFICIAL COMPANY UPDATES</div>
    </div>
  </section>

  <!-- FEATURED + FEED CONTAINER -->
  <div id="contentArea">
    <!-- featured & feed rendered by JS -->
  </div>

  <!-- ARTICLE DETAIL (hidden by default) -->
  <div id="articleDetail" class="hidden container" style="padding-top:1.5rem;"></div>

</main>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-modal">
    <input type="text" id="searchInput" placeholder="Search ZISHU TRON updates..." autofocus />
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" data-view="latest">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>Latest</span>
  </button>
  <button class="nav-item" id="searchToggleBottom">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Search</span>
  </button>
</nav>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="footer-inner">
      <div><span class="footer-brand">ZISHU TRON</span> <small>INSIGHT</small></div>
      <div>Official company updates and announcements.</div>
      <div style="font-size:0.75rem;">&copy; <span id="year"></span> ZISHU TRON</div>
    </div>
  </div>
</footer>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // ----- FIREBASE CONFIG (preserved) -----
  const firebaseConfig = {
    apiKey: "AIzaSyD3Z-IZyMl0Q2nS8DnXj8jDnQ5L8Xj8jDnQ",
    authDomain: "zishu-tron-insight.firebaseapp.com",
    databaseURL: "https://zishu-tron-insight-default-rtdb.firebaseio.com",
    projectId: "zishu-tron-insight",
    storageBucket: "zishu-tron-insight.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef123456"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ----- STATE -----
  let posts = [];
  let currentView = 'home';
  let currentPostId = null;
  let searchResults = [];

  // DOM refs
  const contentArea = document.getElementById('contentArea');
  const detailView = document.getElementById('articleDetail');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchInput = document.getElementById('searchInput');
  const searchResultsEl = document.getElementById('searchResults');

  // ----- THEME -----
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('zt-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.classList.add('dark');
  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('zt-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  });

  // ----- NAVIGATION -----
  document.querySelectorAll('[data-view]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const view = el.dataset.view;
      if (view === 'home' || view === 'latest') {
        currentView = view;
        document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderFeed();
        detailView.classList.add('hidden');
        contentArea.classList.remove('hidden');
        // close mobile nav
        document.getElementById('navLinks').classList.remove('mobile-open');
      }
    });
  });

  // Mobile nav toggle
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('mobile-open');
  });

  // Search
  document.getElementById('searchToggleNav').addEventListener('click', (e) => {
    e.preventDefault();
    searchOverlay.classList.add('open');
    searchInput.value = '';
    searchResultsEl.innerHTML = '';
    searchInput.focus();
  });
  document.getElementById('searchToggleBottom').addEventListener('click', () => {
    searchOverlay.classList.add('open');
    searchInput.value = '';
    searchResultsEl.innerHTML = '';
    searchInput.focus();
  });
  searchOverlay.addEventListener('click', (e) => {
    if (e.target === searchOverlay) searchOverlay.classList.remove('open');
  });

  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { searchResultsEl.innerHTML = ''; return; }
    const results = posts.filter(p => {
      const title = (p.title || '').toLowerCase();
      const content = (p.content || '').toLowerCase();
      const author = (p.authorName || '').toLowerCase();
      return title.includes(q) || content.includes(q) || author.includes(q);
    });
    searchResultsEl.innerHTML = results.length ? results.map(p => `
      <div class="result-item" data-id="${p.id}">
        <div class="r-title">${escHtml(p.title || 'Untitled')}</div>
        <div class="r-meta">${escHtml(p.authorName || 'ZISHU TRON')} · ${formatDate(p.createdAt)}</div>
      </div>
    `).join('') : `<div class="no-result">No updates found. Try another keyword.</div>`;
    // attach click
    searchResultsEl.querySelectorAll('.result-item').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        const post = posts.find(p => p.id === id);
        if (post) { searchOverlay.classList.remove('open'); openArticle(post); }
      });
    });
  });

  // ----- HELPERS -----
  function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(timestamp) {
    if (!timestamp) return 'Unknown date';
    const d = new Date(timestamp);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function readingTime(content) {
    if (!content) return '1 min';
    const words = content.split(/\s+/).length;
    const mins = Math.max(1, Math.round(words / 200));
    return mins + ' min read';
  }

  function getExcerpt(content, len = 120) {
    if (!content) return '';
    const plain = content.replace(/<[^>]*>/g, '');
    return plain.length > len ? plain.slice(0, len) + '…' : plain;
  }

  // ----- RENDER FEED -----
  function renderFeed() {
    if (!posts.length) {
      contentArea.innerHTML = `
        <div class="container">
          <div class="empty-state">
            <h3>No updates yet</h3>
            <p>There are currently no published updates from ZISHU TRON. Check back soon.</p>
          </div>
        </div>
      `;
      return;
    }

    let sorted = [...posts].sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (currentView === 'latest') sorted = sorted.slice(0, 8);

    const featured = sorted[0];
    const rest = sorted.slice(1);

    let html = `
      <section class="featured-section">
        <div class="container">
          <div class="featured-card">
            <div class="label">FEATURED UPDATE</div>
            <h2 data-id="${featured.id}">${escHtml(featured.title || 'Untitled')}</h2>
            <div class="excerpt">${escHtml(getExcerpt(featured.content, 150))}</div>
            <div class="meta">
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${escHtml(featured.authorName || 'ZISHU TRON')}</span>
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${formatDate(featured.createdAt)}</span>
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${readingTime(featured.content)}</span>
            </div>
            <div class="read-link" data-id="${featured.id}">Read update →</div>
          </div>
        </div>
      </section>
    `;

    html += `
      <section class="updates-section">
        <div class="container">
          <div class="section-title">LATEST FROM ZISHU TRON</div>
          <div class="articles-grid">
    `;

    rest.forEach(p => {
      html += `
        <div class="article-card" data-id="${p.id}">
          <div class="card-label">UPDATE</div>
          <div class="card-title">${escHtml(p.title || 'Untitled')}</div>
          <div class="card-excerpt">${escHtml(getExcerpt(p.content, 80))}</div>
          <div class="card-meta">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${escHtml(p.authorName || 'ZISHU TRON')}</span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${formatDate(p.createdAt)}</span>
            <span>${readingTime(p.content)}</span>
          </div>
          <div class="card-read">Read update <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      `;
    });

    html += `</div></div></section>`;
    contentArea.innerHTML = html;
    contentArea.classList.remove('hidden');
    detailView.classList.add('hidden');

    // attach click listeners
    contentArea.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        const id = el.dataset.id;
        const post = posts.find(p => p.id === id);
        if (post) openArticle(post);
      });
    });
  }

  // ----- OPEN ARTICLE DETAIL -----
  function openArticle(post) {
    currentPostId = post.id;
    contentArea.classList.add('hidden');
    detailView.classList.remove('hidden');

    const updatedHtml = post.updatedAt && post.updatedAt !== post.createdAt ?
      `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Updated ${formatDate(post.updatedAt)}</span>` : '';

    const contentHtml = post.content ? post.content.replace(/\n/g, '<br>') : '';

    detailView.innerHTML = `
      <div class="article-detail">
        <div class="back-link" id="backToFeed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Insight</div>
        <div class="detail-label">ZISHU TRON INSIGHT</div>
        <h1>${escHtml(post.title || 'Untitled')}</h1>
        <div class="detail-meta">
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${escHtml(post.authorName || 'ZISHU TRON')}</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${formatDate(post.createdAt)}</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${readingTime(post.content)}</span>
          ${updatedHtml}
        </div>
        <div class="detail-content">${contentHtml}</div>
        <div class="more-articles">
          <h4>More from ZISHU TRON</h4>
          <div class="mini-grid">
            ${posts.filter(p => p.id !== post.id).slice(0, 3).map(p => `
              <div class="mini-card" data-id="${p.id}">
                <div class="mini-title">${escHtml(p.title || 'Untitled')}</div>
                <div class="mini-meta">${formatDate(p.createdAt)} · ${readingTime(p.content)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    document.getElementById('backToFeed').addEventListener('click', () => {
      detailView.classList.add('hidden');
      contentArea.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    detailView.querySelectorAll('.mini-card').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        const p = posts.find(x => x.id === id);
        if (p) openArticle(p);
      });
    });
  }

  // ----- LOAD POSTS FROM FIREBASE (real-time) -----
  function loadPosts() {
    // show skeletons
    contentArea.innerHTML = `
      <div class="container" style="padding-top:1.5rem;">
        <div class="skeleton"><div class="line long"></div><div class="line medium"></div><div class="line short"></div></div>
        <div class="skeleton"><div class="line long"></div><div class="line medium"></div><div class="line short"></div></div>
        <div class="skeleton"><div class="line long"></div><div class="line medium"></div><div class="line short"></div></div>
      </div>
    `;

    db.ref('posts').on('value', (snapshot) => {
      const data = snapshot.val();
      posts = [];
      if (data) {
        Object.keys(data).forEach(key => {
          const p = data[key];
          posts.push({
            id: key,
            title: p.title || 'Untitled',
            content: p.content || '',
            authorName: p.authorName || 'ZISHU TRON',
            createdAt: p.createdAt || Date.now(),
            updatedAt: p.updatedAt || null
          });
        });
      }
      renderFeed();
    }, (err) => {
      console.error('Firebase error:', err);
      contentArea.innerHTML = `
        <div class="container">
          <div class="empty-state">
            <h3>Unable to load updates</h3>
            <p>Please check your connection and try again.</p>
          </div>
        </div>
      `;
    });
  }

  // ----- YEAR -----
  document.getElementById('year').textContent = new Date().getFullYear();

  // ----- INIT -----
  loadPosts();

  // Close search on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') searchOverlay.classList.remove('open');
  });
</script>
</body>
</html>
