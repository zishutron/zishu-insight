<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>ZISHU TRON INSIGHT — Official ZISHU TRON Updates</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f8fafc;
      color: #0b1a2f;
      padding-bottom: 20px;
    }
    body.dark {
      background: #0f172a;
      color: #e8edf5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    body.dark .top-header {
      border-bottom-color: rgba(255,255,255,0.06);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      flex: 1 1 auto;
    }
    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      flex-shrink: 0;
    }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0b1a2f, #1e3b5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    body.dark .brand h1 {
      background: linear-gradient(135deg, #d6e4ff, #a0c0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand span {
      font-size: 0.75rem;
      color: #4a5b6e;
      letter-spacing: 0.02em;
    }
    body.dark .brand span {
      color: #a3b8d9;
    }

    .header-search {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 60px;
      padding: 3px 12px 3px 16px;
      border: 1px solid #d0ddee;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex: 0 1 200px;
      min-width: 120px;
      max-width: 220px;
    }
    body.dark .header-search {
      background: #1e2a40;
      border-color: #3d5478;
    }
    .header-search input {
      border: none;
      background: transparent;
      padding: 8px 6px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      color: inherit;
    }
    .header-search button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 2px 2px 6px;
      color: #1e3b5c;
      font-size: 1rem;
    }
    body.dark .header-search button {
      color: #b6cae5;
    }

    .feed-header {
      margin: 20px 0 16px;
    }
    .post-card {
      background: white;
      border-radius: 24px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
      border: 1px solid #eef3f9;
      transition: 0.1s;
    }
    body.dark .post-card {
      background: #1a263b;
      border-color: #2e405b;
    }
    .post-card:hover {
      border-color: #cbd9ec;
    }
    .post-card h4 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .post-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #4a5f7a;
      margin: 10px 0 12px;
    }
    body.dark .post-meta {
      color: #a3bbd9;
    }
    .post-meta strong {
      color: #0b1a2f;
    }
    body.dark .post-meta strong {
      color: #d0e0fc;
    }
    .post-excerpt {
      color: #1f3147;
      line-height: 1.6;
      margin: 8px 0 14px;
    }
    body.dark .post-excerpt {
      color: #c6d6ed;
    }
    .card-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-read {
      background: #eef3fa;
      border: none;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      color: #0b1a2f;
      cursor: pointer;
    }
    body.dark .btn-read {
      background: #2e405f;
      color: #e8edf5;
    }
    .btn-read:hover {
      background: #d7e1ee;
    }

    .empty-state {
      padding: 60px 0;
      text-align: center;
      color: #4a5f7a;
    }
    .empty-state h4 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .hidden {
      display: none !important;
    }
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #0b1a2f;
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      max-width: 90%;
      text-align: center;
    }
    body.dark .toast {
      background: #d6e4ff;
      color: #0b1a2f;
    }
    .full-article-content {
      line-height: 1.8;
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .full-article-content p { margin-bottom: 1.2rem; }

    @media (max-width: 720px) {
      .container { padding: 0 14px; }
      .post-card { padding: 18px; }
      .header-search { flex: 1 1 100%; max-width: 100%; order: 10; }
      .header-left { width: 100%; flex-wrap: wrap; }
      .brand { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="container top-header">
      <div class="header-left">
        <div class="brand">
          <h1>ZISHU TRON INSIGHT</h1>
          <span>The official updates from ZISHU TRON.</span>
        </div>
        <div class="header-search" id="headerSearch">
          <input type="text" id="searchInput" placeholder="Search insights…" />
          <button id="searchBtn">⌕</button>
        </div>
      </div>
    </header>

    <main class="container" id="mainContent">
      <section id="homePage">
        <div class="feed-header"></div>
        <div id="postsFeed"></div>
        <div id="emptyFeed" class="empty-state hidden"><h4>No updates yet</h4><p>Check back later for new insights from ZISHU TRON.</p></div>
      </section>

      <section id="articleView" class="hidden">
        <button id="backFromArticle" style="background:none;border:none;font-size:1.2rem;cursor:pointer;margin-bottom:12px;">← Back to Insights</button>
        <div id="fullArticleContainer"></div>
      </section>
    </main>

    <div id="toastContainer" class="toast hidden"></div>
  </div>

  <script>
    (function(){
      const firebaseConfig = {
        apiKey: "AIzaSyAL0FSX7YfhQ-IoqE3a7axcLjgN7cPySM0",
        authDomain: "stardust-official.firebaseapp.com",
        databaseURL: "https://stardust-official-default-rtdb.firebaseio.com",
        projectId: "stardust-official",
        storageBucket: "stardust-official.firebasestorage.app",
        messagingSenderId: "1065835601050",
        appId: "1:1065835601050:web:56d326d89b1efb52f45323",
        measurementId: "G-X552DVRG7K"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let allPosts = [];

      const $ = (s) => document.querySelector(s);
      const postsFeed = $('#postsFeed');
      const emptyFeed = $('#emptyFeed');
      const toastContainer = $('#toastContainer');
      const searchInput = $('#searchInput');
      const homePage = $('#homePage');
      const articleView = $('#articleView');

      function showToast(msg) {
        toastContainer.textContent = msg;
        toastContainer.classList.remove('hidden');
        setTimeout(() => toastContainer.classList.add('hidden'), 4000);
      }

      function renderPostCard(post, id) {
        const excerpt = post.content?.slice(0, 160) + (post.content?.length > 160 ? '…' : '') || '';
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : 'Recent';
        const readTime = Math.ceil((post.content?.length || 0) / 1200) || 1;
        return `<div class="post-card" data-id="${id}">
          <h4>${post.title || 'Untitled'}</h4>
          <div class="post-meta">By <strong>${post.authorName || 'ZISHU TRON'}</strong> · ${date} · ${readTime} min read</div>
          <div class="post-excerpt">${excerpt}</div>
          <div class="card-actions">
            <button class="btn-read" data-id="${id}">Read Article</button>
          </div>
        </div>`;
      }

      function renderFullArticle(post) {
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) : 'Recent';
        const updated = post.updatedAt ? new Date(post.updatedAt).toLocaleDateString() : '';
        return `<h2 style="font-size:2rem;margin-bottom:6px;">${post.title}</h2>
          <div style="color:#4a5f7a;margin-bottom:12px;">By ${post.authorName || 'ZISHU TRON'} · Published: ${date} ${updated ? '· Updated: '+updated : ''}</div>
          <div class="full-article-content">${post.content?.replace(/\n/g, '<br>') || ''}</div>`;
      }

      function loadPosts() {
        const ref = db.ref('posts').orderByChild('createdAt').limitToLast(50);
        ref.on('value', (snap) => {
          const data = snap.val();
          if (!data) { allPosts = []; postsFeed.innerHTML = ''; emptyFeed.classList.remove('hidden'); return; }
          allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
          emptyFeed.classList.add('hidden');
          renderFeed(allPosts);
        });
      }

      function renderFeed(posts) {
        if (!posts || posts.length === 0) { postsFeed.innerHTML = ''; emptyFeed.classList.remove('hidden'); return; }
        emptyFeed.classList.add('hidden');
        postsFeed.innerHTML = posts.map(p => renderPostCard(p, p.id)).join('');
      }

      function searchPosts(query) {
        if (!query.trim()) { renderFeed(allPosts); return; }
        const q = query.toLowerCase();
        const filtered = allPosts.filter(p => 
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q))
        );
        renderFeed(filtered);
      }

      function navigate(page) {
        if (page === 'home') {
          homePage.classList.remove('hidden');
          articleView.classList.add('hidden');
        } else if (page === 'article') {
          homePage.classList.add('hidden');
          articleView.classList.remove('hidden');
        }
      }

      let searchTimeout;
      searchInput?.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchPosts(searchInput.value), 300);
      });

      $('#backFromArticle')?.addEventListener('click', () => navigate('home'));

      document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-id]');
        if (!target) return;
        const id = target.dataset.id;
        if (target.classList.contains('btn-read')) {
          const post = allPosts.find(p => p.id === id);
          if (!post) return;
          $('#fullArticleContainer').innerHTML = renderFullArticle(post);
          navigate('article');
        }
      });

      loadPosts();
      navigate('home');
    })();
  </script>
</body>
</html>
