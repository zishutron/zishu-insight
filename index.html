<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Upcodez — Web Source Inspector & Developer Tools</title>
    <meta name="description" content="Inspect publicly accessible web source code and explore public IP and domain information with Upcodez.">
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Upcodez — Web Source Inspector & Developer Tools">
    <meta property="og:description" content="Inspect publicly accessible web source code and explore public IP and domain information with Upcodez.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://upcodez.example.com">
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
            line-height: 1.5;
        }
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-code: #f1f5f9;
            --text-primary: #0b1120;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --radius-card: 12px;
            --radius-code: 8px;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --transition: 0.15s ease;
        }
        [data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --bg-code: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
        }
        a { color: var(--accent); text-decoration: none; }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }
        /* navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 30;
            backdrop-filter: blur(6px);
            background: rgba(var(--bg-surface-rgb, 255,255,255), 0.8);
        }
        [data-theme="dark"] .navbar { background: rgba(30, 41, 59, 0.85); }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }
        .nav-brand .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .nav-links {
            display: flex;
            gap: 1.8rem;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .nav-links a { color: var(--text-secondary); transition: color 0.15s; }
        .nav-links a:hover { color: var(--accent); }
        .nav-links .active { color: var(--accent); }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: 0.15s;
        }
        .theme-toggle:hover { background: var(--bg-code); }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: 0.2s;
        }
        /* mobile nav */
        .mobile-nav {
            display: none;
            flex-direction: column;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 1.25rem 1.2rem;
            gap: 0.8rem;
        }
        .mobile-nav a { font-weight: 500; color: var(--text-secondary); }
        .mobile-nav a.active { color: var(--accent); }

        /* hero & cards */
        .hero {
            padding: 2.5rem 0 1.5rem;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto 1.5rem;
        }
        .inspect-form {
            background: var(--bg-surface);
            border-radius: var(--radius-card);
            padding: 1.5rem 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            max-width: 700px;
            margin: 0 auto 0.5rem;
            text-align: left;
        }
        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .form-row input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
            min-width: 180px;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.15s;
        }
        .form-row input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }

        /* cards grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin: 2.5rem 0 1.5rem;
        }
        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 1.25rem 1.2rem;
            box-shadow: var(--shadow-sm);
        }
        .feature-card h3 { font-size: 1.05rem; margin-bottom: 0.2rem; }
        .feature-card p { color: var(--text-secondary); font-size: 0.9rem; }

        .steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 2.5rem;
        }
        .step { background: var(--bg-card); border-radius: var(--radius-card); padding: 1.2rem; border: 1px solid var(--border-color); }

        /* result viewer */
        .result-container {
            margin-top: 2rem;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem 1.8rem;
            padding: 1rem 1.5rem;
            background: var(--bg-code);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        .result-meta span { color: var(--text-secondary); }
        .result-meta strong { color: var(--text-primary); }
        .code-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.8rem;
            padding: 0.6rem 1.2rem;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        .code-toolbar button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.25rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-body);
        }
        .code-toolbar button:hover { background: var(--bg-code); }
        .code-wrapper {
            position: relative;
            max-height: 480px;
            overflow: auto;
            background: var(--bg-code);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            padding: 0.8rem 1rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .code-wrapper .line-numbers {
            user-select: none;
            color: var(--text-muted);
            padding-right: 1rem;
            border-right: 1px solid var(--border-color);
            margin-right: 1rem;
            display: inline-block;
            text-align: right;
        }
        .code-wrapper pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
        .empty-state {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 2.4rem; opacity: 0.5; margin-bottom: 0.5rem; display: block; }
        /* ip page */
        .ip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin: 1.5rem 0;
        }
        .ip-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow-sm);
        }
        .ip-card h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 0.2rem; }
        .ip-card .value { font-weight: 500; font-size: 1.1rem; }
        .skeleton { background: var(--bg-code); border-radius: 6px; height: 1.2rem; width: 60%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .footer {
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
            padding: 2rem 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1.2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .footer-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .footer-links a { color: var(--text-secondary); }
        .footer-links a:hover { color: var(--accent); }
        .page-title { font-size: 1.8rem; font-weight: 700; margin: 1.2rem 0 0.2rem; letter-spacing: -0.02em; }

        @media (max-width: 700px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .mobile-nav.open { display: flex; }
            .hero h1 { font-size: 1.8rem; }
            .form-row { flex-direction: column; }
            .form-row input { width: 100%; }
            .btn-primary { width: 100%; justify-content: center; }
            .ip-grid { grid-template-columns: 1fr; }
            .footer { flex-direction: column; align-items: center; text-align: center; }
            .result-meta { flex-direction: column; gap: 0.2rem; }
        }
        @media (max-width: 480px) {
            .container { padding: 0 0.8rem; }
            .inspect-form { padding: 1rem; }
        }
        /* utility */
        .mt-1 { margin-top: 0.75rem; }
        .mb-1 { margin-bottom: 0.75rem; }
        .flex { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .text-muted { color: var(--text-muted); }
        .hidden { display: none !important; }
        .loading-text { color: var(--text-muted); font-size: 0.95rem; }
        /* about/privacy/terms content */
        .content-page { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        .content-page h1 { font-size: 1.8rem; margin: 0.5rem 0 0.5rem; }
        .content-page h2 { font-size: 1.6rem; margin: 1.5rem 0 0.5rem; }
        .content-page p { margin-bottom: 0.8rem; color: var(--text-secondary); }
        /* toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            box-shadow: var(--shadow-md);
            z-index: 100;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .toast.success { border-left: 4px solid #22c55e; }
        .toast.error { border-left: 4px solid #ef4444; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-brand">
        <span class="logo-icon">&lt;/&gt;</span>
        Upcodez
    </div>
    <div class="nav-links">
        <a href="/" class="active" data-nav>Source Inspector</a>
        <a href="/ip" data-nav>IP Lookup</a>
        <a href="/about" data-nav>About</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>
</nav>
<!-- mobile nav -->
<div class="mobile-nav" id="mobileNav">
    <a href="/" class="active" data-nav>Source Inspector</a>
    <a href="/ip" data-nav>IP Lookup</a>
    <a href="/about" data-nav>About</a>
    <button class="theme-toggle" id="themeToggleMobile" style="align-self:flex-start; margin-top:4px;">🌙</button>
</div>

<!-- MAIN APP -->
<div id="app" class="container" style="min-height:70vh;">
    <!-- dynamic content rendered here -->
</div>

<!-- FOOTER -->
<footer class="container footer">
    <div><span class="logo-icon" style="display:inline-flex;width:24px;height:24px;font-size:0.9rem;margin-right:6px;">&lt;/&gt;</span> Upcodez — Professional tools for understanding the web.</div>
    <div class="footer-links">
        <a href="/">Source Inspector</a>
        <a href="/ip">IP Lookup</a>
        <a href="/about">About</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
    </div>
    <div>© 2026 Upcodez</div>
</footer>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script>
    (function() {
        // ---------- CONFIGURATION ----------
        const API_BASE_URL = 'https://stardust-ai.onrender.com';

        // ---------- TOAST ----------
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ---------- THEME ----------
        function getPreferredTheme() {
            const stored = localStorage.getItem('upcodez-theme');
            if (stored === 'dark' || stored === 'light') return stored;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('upcodez-theme', theme);
            const icon = document.getElementById('themeToggle');
            const iconM = document.getElementById('themeToggleMobile');
            const label = theme === 'dark' ? '☀️' : '🌙';
            if (icon) icon.textContent = label;
            if (iconM) iconM.textContent = label;
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }
        document.addEventListener('DOMContentLoaded', function() {
            applyTheme(getPreferredTheme());
            document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
            document.getElementById('themeToggleMobile')?.addEventListener('click', toggleTheme);
            // hamburger
            const ham = document.getElementById('hamburger');
            const mobileNav = document.getElementById('mobileNav');
            ham?.addEventListener('click', () => mobileNav.classList.toggle('open'));
            // close mobile on link click
            document.querySelectorAll('#mobileNav a').forEach(a => a.addEventListener('click', () => mobileNav.classList.remove('open')));
        });

        // ---------- ROUTER ----------
        const routes = {
            '/': renderHome,
            '/ip': renderIp,
            '/about': renderAbout,
            '/privacy': renderPrivacy,
            '/terms': renderTerms
        };

        function navigate(path) {
            window.history.pushState({}, '', path);
            renderPage(path);
        }

        function renderPage(path) {
            const app = document.getElementById('app');
            const routeFn = routes[path] || routes['/'];
            app.innerHTML = routeFn();
            // highlight active nav
            document.querySelectorAll('[data-nav]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('href') === path);
            });
            // re-bind events specific to page
            if (path === '/') bindSourceInspector();
            if (path === '/ip') bindIpLookup();
        }

        // ---------- HOME ----------
        function renderHome() {
            return `
            <div class="hero">
                <h1>Inspect the Web. Understand the Code.</h1>
                <p>Enter a public website URL and inspect its publicly accessible HTML source with Upcodez.</p>
            </div>
            <div class="inspect-form">
                <div class="form-row">
                    <input type="text" id="urlInput" placeholder="https://example.com" value="https://example.com">
                    <button class="btn-primary" id="inspectBtn">Inspect Source</button>
                </div>
                <div class="note">🔒 Only inspect websites and resources you are authorized to access.</div>
            </div>
            <div id="resultArea"></div>
            <div class="steps">
                <div class="step"><strong>1. Enter URL</strong><br><span class="text-muted">A publicly accessible website URL.</span></div>
                <div class="step"><strong>2. Inspect</strong><br><span class="text-muted">Upcodez retrieves the public HTML via secure backend.</span></div>
                <div class="step"><strong>3. Understand</strong><br><span class="text-muted">View source and response info in a clean interface.</span></div>
            </div>
            <div class="feature-grid">
                <div class="feature-card"><h3>📄 Source Inspector</h3><p>Inspect publicly accessible HTML source.</p></div>
                <div class="feature-card"><h3>🌐 IP Lookup</h3><p>Analyze public IP and domain information.</p></div>
                <div class="feature-card"><h3>🛠️ Developer Tools</h3><p>A growing collection of web utilities.</p></div>
            </div>
            `;
        }

        function bindSourceInspector() {
            const input = document.getElementById('urlInput');
            const btn = document.getElementById('inspectBtn');
            const area = document.getElementById('resultArea');
            if (!btn) return;

            btn.addEventListener('click', async () => {
                let url = input.value.trim();
                if (!url) { 
                    area.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>Please enter a valid URL.</div>';
                    showToast('Please enter a URL to inspect', 'error');
                    return; 
                }
                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                
                area.innerHTML = `<div class="empty-state"><span class="icon">⏳</span>Connecting...<br><span class="loading-text">Fetching public source...</span></div>`;
                btn.disabled = true;
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/source`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        area.innerHTML = `<div class="empty-state"><span class="icon">❌</span>${data.error || 'Unable to inspect this website.'}</div>`;
                        showToast(data.error || 'Failed to inspect source', 'error');
                        return;
                    }
                    
                    // display result
                    const size = data.size ? (data.size / 1024).toFixed(1) + ' KB' : '—';
                    area.innerHTML = `
                    <div class="result-container">
                        <div class="result-meta">
                            <span><strong>Status:</strong> ${data.status || '—'}</span>
                            <span><strong>Content-Type:</strong> ${data.contentType || '—'}</span>
                            <span><strong>Response Time:</strong> ${data.responseTime || '—'} ms</span>
                            <span><strong>Size:</strong> ${size}</span>
                            <span><strong>Final URL:</strong> ${data.finalUrl || url}</span>
                        </div>
                        <div class="code-toolbar">
                            <button id="copyBtn">📋 Copy</button>
                            <button id="downloadBtn">⬇ Download</button>
                            <button id="fullscreenBtn">⛶ Fullscreen</button>
                            <span style="margin-left:auto;font-size:0.75rem;color:var(--text-muted);">${data.source ? data.source.length.toLocaleString() : 0} chars</span>
                        </div>
                        <div class="code-wrapper" id="codeWrapper">
                            <pre id="codePre">${escapeHtml(data.source || '')}</pre>
                        </div>
                    </div>
                    `;
                    
                    // Toolbar buttons
                    document.getElementById('copyBtn')?.addEventListener('click', () => {
                        const text = document.getElementById('codePre')?.textContent || '';
                        navigator.clipboard?.writeText(text).then(() => {
                            showToast('Copied to clipboard!', 'success');
                        }).catch(() => {
                            showToast('Failed to copy', 'error');
                        });
                    });
                    
                    document.getElementById('downloadBtn')?.addEventListener('click', () => {
                        const text = document.getElementById('codePre')?.textContent || '';
                        const blob = new Blob([text], {type: 'text/html'});
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'source.html';
                        a.click();
                        showToast('Download started!', 'success');
                    });
                    
                    document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
                        const wrapper = document.getElementById('codeWrapper');
                        if (wrapper.requestFullscreen) {
                            wrapper.requestFullscreen().catch(() => {});
                        }
                    });
                    
                    showToast('Source inspected successfully!', 'success');
                } catch(e) {
                    area.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span>Network error. Please try again.</div>`;
                    showToast('Network error. Please check your connection.', 'error');
                }
                btn.disabled = false;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // ---------- IP PAGE ----------
        function renderIp() {
            return `
            <div class="hero" style="padding-bottom:0.5rem;">
                <h1>IP & Domain Intelligence</h1>
                <p>Enter a domain or IP address to view publicly available network information.</p>
            </div>
            <div class="inspect-form" style="max-width:600px;">
                <div class="form-row">
                    <input type="text" id="ipInput" placeholder="example.com or 93.184.216.34" value="example.com">
                    <button class="btn-primary" id="ipBtn">Analyze</button>
                </div>
            </div>
            <div id="ipResult"></div>
            `;
        }

        function bindIpLookup() {
            const input = document.getElementById('ipInput');
            const btn = document.getElementById('ipBtn');
            const result = document.getElementById('ipResult');
            if (!btn) return;
            
            btn.addEventListener('click', async () => {
                const target = input.value.trim();
                if (!target) { 
                    result.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>Enter a domain or IP.</div>';
                    showToast('Please enter a domain or IP address', 'error');
                    return; 
                }
                
                result.innerHTML = `<div class="empty-state"><span class="icon">⏳</span>Analyzing network information...</div>`;
                btn.disabled = true;
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/ip?target=${encodeURIComponent(target)}`);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        result.innerHTML = `<div class="empty-state"><span class="icon">❌</span>${data.error || 'Could not retrieve IP intelligence.'}</div>`;
                        showToast(data.error || 'Failed to lookup IP', 'error');
                        return;
                    }
                    
                    // render cards
                    result.innerHTML = `
                    <div style="margin-top:1.2rem;">
                        <div class="ip-grid">
                            <div class="ip-card"><h4>Target</h4><div class="value">${data.target || target}</div></div>
                            <div class="ip-card"><h4>Resolved IP</h4><div class="value">${data.resolvedIP || '—'}</div></div>
                            <div class="ip-card"><h4>IPv4</h4><div class="value">${data.ipv4 || '—'}</div></div>
                            <div class="ip-card"><h4>IPv6</h4><div class="value">${data.ipv6 || '—'}</div></div>
                            <div class="ip-card"><h4>ASN</h4><div class="value">${data.asn || '—'}</div></div>
                            <div class="ip-card"><h4>Organization</h4><div class="value">${data.organization || '—'}</div></div>
                            <div class="ip-card"><h4>Country</h4><div class="value">${data.country || '—'}</div></div>
                            <div class="ip-card"><h4>Region</h4><div class="value">${data.region || '—'}</div></div>
                            <div class="ip-card"><h4>City</h4><div class="value">${data.city || '—'}</div></div>
                            <div class="ip-card"><h4>Timezone</h4><div class="value">${data.timezone || '—'}</div></div>
                            <div class="ip-card"><h4>A Records</h4><div class="value" style="font-size:0.9rem;">${data.aRecords ? data.aRecords.join(', ') : '—'}</div></div>
                            <div class="ip-card"><h4>AAAA Records</h4><div class="value" style="font-size:0.9rem;">${data.aaaaRecords ? data.aaaaRecords.join(', ') : '—'}</div></div>
                            <div class="ip-card"><h4>Reverse DNS</h4><div class="value" style="font-size:0.9rem;">${data.reverse || '—'}</div></div>
                        </div>
                        <p class="text-muted" style="font-size:0.8rem;margin-top:0.2rem;">📍 Approximate location — IP geolocation is not exact.</p>
                    </div>
                    `;
                    
                    showToast('IP lookup completed!', 'success');
                } catch(e) {
                    result.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span>Network error. Please try again.</div>`;
                    showToast('Network error. Please check your connection.', 'error');
                }
                btn.disabled = false;
            });
        }

        // ---------- STATIC PAGES ----------
        function renderAbout() {

                <h1>About Upcodez</h1>
                <p>Upcodez is a developer-focused web utility platform designed to make basic web inspection and publicly available domain/network information easier to understand. It provides a clean, professional interface for inspecting HTML source and exploring IP intelligence.</p>
                <p>Built with security and privacy in mind, Upcodez only retrieves publicly accessible web pages and network data through its secure backend API.</p>
                <h2>Features</h2>
                <ul style="color:var(--text-secondary);margin-left:1.5rem;margin-bottom:1rem;">
                    <li>🔍 Inspect publicly accessible HTML source</li>
                    <li>🌐 Look up domain and IP information</li>
                    <li>📋 Copy, download, and view source in fullscreen</li>
                    <li>🌙 Dark/Light mode support</li>
                    <li>📱 Fully responsive mobile design</li>

            </div>`; 
        }

        function renderTerms() { 
            return `<div class="content-page">
                <h1>Terms of Service</h1>
                <p><strong>Last updated: August 2026</strong></p>
                <p>By using Upcodez, you agree to the following terms and conditions.</p>
                <h2>Acceptable Use</h2>
                <p>Upcodez is provided as an inspection and diagnostic utility. You agree to use it only for legitimate purposes and only on websites and resources you are authorized to access.</p>

                <ul style="color:var(--text-secondary);margin-left:1.5rem;margin-bottom:1rem;">
                    <li>Unauthorized access to private or internal systems</li>

                    <li>Abuse of the service through excessive requests</li>
                    <li>Using the service for illegal activities</li>
                </ul>
                <h2>Rate Limiting</h2>
                <p>To ensure fair usage, rate limits are applied to API requests. Excessive usage may result in temporary blocks.</p>
                <h2>Service Availability</h2>
                <p>Upcodez is provided "as is" without any guarantees of uptime or availability. We reserve the right to modify or discontinue the service at any time.</p>

                <p>You are solely responsible for your use of Upcodez and for ensuring you have proper authorization to inspect any website or resource.</p>
            </div>`; 
        }

        // ---------- NAVIGATION ----------
        window.addEventListener('popstate', () => renderPage(window.location.pathname));
        document.addEventListener('DOMContentLoaded', () => {
            renderPage(window.location.pathname);
            // Intercept nav clicks
            document.querySelectorAll('[data-nav]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const href = el.getAttribute('href');
                    if (href) navigate(href);
                });
            });
        });
    })();
</script>
