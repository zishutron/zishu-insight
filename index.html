<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>ZISHU TRON INSIGHT</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f8f7ff;
      color: #1a1030;
      padding-bottom: 80px;
      transition: background 0.2s, color 0.2s;
    }
    body.dark {
      background: #0d0b1a;
      color: #eae6f5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    /* header – clean, no brand text */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 0 10px;
      border-bottom: 1px solid rgba(120, 80, 200, 0.15);
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    body.dark .top-header {
      border-bottom-color: rgba(160, 130, 220, 0.2);
    }
    .header-left {
      flex: 1;
    }
    /* dark mode toggle */
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a3a6b;
      transition: 0.2s;
    }
    body.dark .theme-toggle {
      color: #c8b8f0;
    }
    .theme-toggle svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .theme-toggle:hover {
      background: rgba(120, 80, 200, 0.08);
    }

    /* feed */
    .feed-header {
      margin: 10px 0 6px;
    }
    .post-card {
      background: white;
      border-radius: 28px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(80, 50, 160, 0.04);
      border: 1px solid #ede8f8;
      transition: 0.15s;
      cursor: default;
    }
    body.dark .post-card {
      background: #18152e;
      border-color: #322d50;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .post-card:hover {
      border-color: #b8a8e0;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(80, 50, 160, 0.08);
    }
    body.dark .post-card:hover {
      border-color: #7a6aa8;
    }
    .post-card h4 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1f1538;
    }
    body.dark .post-card h4 {
      color: #e2d9fc;
    }
    .post-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #5a4a7a;
      margin: 8px 0 12px;
    }
    body.dark .post-meta {
      color: #b0a0d0;
    }
    .post-meta strong {
      color: #1f1538;
    }
    body.dark .post-meta strong {
      color: #d6ccf5;
    }
    /* full article content – clean, readable */
    .full-article-content {
      line-height: 1.8;
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto;
      color: #1f1538;
    }
    body.dark .full-article-content {
      color: #ded6f0;
    }
    .full-article-content p {
      margin-bottom: 1.2rem;
    }
    .post-excerpt {
      color: #2f234a;
      line-height: 1.6;
      margin: 8px 0 14px;
      font-size: 1rem;
    }
    body.dark .post-excerpt {
      color: #c8bce0;
    }
    .card-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-read {
      background: #ede6fc;
      border: none;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 600;
      color: #2a1a50;
      cursor: pointer;
      transition: 0.15s;
    }
    body.dark .btn-read {
      background: #2f2850;
      color: #e0d8f5;
    }
    .btn-read:hover {
      background: #d8ccf5;
    }
    body.dark .btn-read:hover {
      background: #423b6a;
    }

    .empty-state {
      padding: 60px 0;
      text-align: center;
      color: #5a4a7a;
    }
    .empty-state h4 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .hidden {
      display: none !important;
    }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a1a50;
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      max-width: 90%;
      text-align: center;
    }
    body.dark .toast {
      background: #c8b8f0;
      color: #1a1030;
    }

    /* Full article view */
    #articleView {
      padding: 20px 0;
    }
    #articleView .back-btn {
      background: none;
      border: none;
      font-size: 1rem;
      color: #5a3a9e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    body.dark #articleView .back-btn {
      color: #b098e0;
    }
    #articleView .back-btn:hover {
      text-decoration: underline;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(248, 247, 255, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e0d8f0;
      padding: 8px 0;
      justify-content: space-around;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(80, 50, 160, 0.06);
    }
    body.dark .bottom-nav {
      background: rgba(20, 16, 38, 0.9);
      border-top-color: #322d50;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #6a5a8a;
      font-size: 0.65rem;
      gap: 2px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 16px;
      transition: 0.2s;
      position: relative;
    }
    body.dark .bottom-nav .nav-item {
      color: #9484b8;
    }
    .bottom-nav .nav-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bottom-nav .nav-item.active {
      color: #4a2a8a;
    }
    body.dark .bottom-nav .nav-item.active {
      color: #b098e0;
    }

    /* Search Section - Full Screen */
    #searchSection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f8f7ff;
      z-index: 50;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    body.dark #searchSection {
      background: #0d0b1a;
    }
    #searchSection.open {
      display: flex;
    }
    .search-header-full {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #e0d8f0;
      margin-bottom: 16px;
    }
    body.dark .search-header-full {
      border-bottom-color: #322d50;
    }
    .search-header-full .close-search {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6a5a8a;
      padding: 4px 8px;
    }
    .search-header-full .close-search:hover {
      color: #8a3a3a;
    }
    .search-header-full input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid #d0c8e8;
      font-size: 1rem;
      background: white;
      color: inherit;
      outline: none;
    }
    body.dark .search-header-full input {
      background: #1a1730;
      border-color: #423b6a;
      color: #eae6f5;
    }
    .search-header-full input:focus {
      border-color: #5a3a9e;
    }
    .search-results-full {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .search-result-item {
      background: white;
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 12px;
      border: 1px solid #ede8f8;
      cursor: pointer;
      transition: 0.1s;
    }
    body.dark .search-result-item {
      background: #18152e;
      border-color: #322d50;
    }
    .search-result-item:hover {
      border-color: #b8a8e0;
      transform: translateY(-1px);
    }
    .search-result-item h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .search-result-item .excerpt {
      font-size: 0.9rem;
      color: #5a4a7a;
      line-height: 1.5;
    }
    body.dark .search-result-item .excerpt {
      color: #b0a0d0;
    }
    .search-empty {
      text-align: center;
      padding: 60px 0;
      color: #5a4a7a;
    }
    .search-empty h4 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    @media (max-width: 720px) {
      .container { padding: 0 14px; }
      .post-card { padding: 18px; }
      body { padding-bottom: 80px; }
      .post-card h4 { font-size: 1.25rem; }
    }
    @media (min-width: 721px) {
      .bottom-nav { display: flex !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header – no brand text, only dark toggle -->
    <header class="container top-header">
      <div class="header-left"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <!-- Main Content -->
    <main class="container" id="mainContent">
      <!-- Home Feed -->
      <section id="homePage">
        <div class="feed-header"></div>
        <div id="postsFeed"></div>
        <div id="emptyFeed" class="empty-state hidden"><h4>No updates yet</h4><p>Check back later for new insights from ZISHU TRON.</p></div>
      </section>

      <!-- Full Article View -->
      <section id="articleView" class="hidden">
        <button class="back-btn" id="backFromArticle">← Back to Insights</button>
        <div id="fullArticleContainer"></div>
      </section>
    </main>

    <!-- Full Screen Search Section -->
    <div id="searchSection">
      <div class="search-header-full">
        <button class="close-search" id="closeSearch">✕</button>
        <input type="text" id="searchInputFull" placeholder="Search insights…" autofocus />
      </div>
      <div class="search-results-full" id="searchResultsFull">
        <div class="search-empty">
          <h4>Type to search</h4>
          <p>Search articles by title or content</p>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-page="home" id="navHome">
        <svg><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="search" id="navSearch">
        <svg><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
    </nav>

    <div id="toastContainer" class="toast hidden"></div>
  </div>

  <script>
    (function(){
      const firebaseConfig = {
        apiKey: "AIzaSyAL0FSX7YfhQ-IoqE3a7axcLjgN7cPySM0",
        authDomain: "stardust-official.firebaseapp.com",
        databaseURL: "https://stardust-official-default-rtdb.firebaseio.com",
        projectId: "stardust-official",
        storageBucket: "stardust-official.firebasestorage.app",
        messagingSenderId: "1065835601050",
        appId: "1:1065835601050:web:56d326d89b1efb52f45323",
        measurementId: "G-X552DVRG7K"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let allPosts = [];
      let searchQuery = '';

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      const postsFeed = $('#postsFeed');
      const emptyFeed = $('#emptyFeed');
      const toastContainer = $('#toastContainer');
      const homePage = $('#homePage');
      const articleView = $('#articleView');
      const fullArticleContainer = $('#fullArticleContainer');
      const navHome = $('#navHome');
      const navSearch = $('#navSearch');
      const searchSection = $('#searchSection');
      const searchInputFull = $('#searchInputFull');
      const searchResultsFull = $('#searchResultsFull');
      const closeSearchBtn = $('#closeSearch');
      const themeToggle = $('#themeToggle');

      // --- Theme ---
      function setTheme(dark) {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('zishu-theme', dark ? 'dark' : 'light');
      }
      const saved = localStorage.getItem('zishu-theme');
      if (saved === 'dark') setTheme(true);
      themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        setTheme(!isDark);
      });

      function showToast(msg) {
        toastContainer.textContent = msg;
        toastContainer.classList.remove('hidden');
        setTimeout(() => toastContainer.classList.add('hidden'), 4000);
      }

      function renderPostCard(post, id) {
        const excerpt = post.content?.slice(0, 160) + (post.content?.length > 160 ? '…' : '') || '';
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : 'Recent';
        const readTime = Math.ceil((post.content?.length || 0) / 1200) || 1;
        return `<div class="post-card" data-id="${id}">
          <h4>${post.title || 'Untitled'}</h4>
          <div class="post-meta">By <strong>${post.authorName || 'ZISHU TRON'}</strong> · ${date} · ${readTime} min read</div>
          <div class="post-excerpt">${excerpt}</div>
          <div class="card-actions">
            <button class="btn-read" data-id="${id}">Read Article</button>
          </div>
        </div>`;
      }

      function renderSearchResult(post, id) {
        const excerpt = post.content?.slice(0, 120) + (post.content?.length > 120 ? '…' : '') || '';
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : 'Recent';
        return `<div class="search-result-item" data-id="${id}">
          <h4>${post.title || 'Untitled'}</h4>
          <div style="font-size:0.8rem;color:#5a4a7a;margin:4px 0;">${post.authorName || 'ZISHU TRON'} · ${date}</div>
          <div class="excerpt">${excerpt}</div>
        </div>`;
      }

      function renderFullArticle(post) {
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) : 'Recent';
        const updated = post.updatedAt ? new Date(post.updatedAt).toLocaleDateString() : '';
        return `<h2 style="font-size:2rem;margin-bottom:6px;color:inherit;">${post.title}</h2>
          <div style="color:#5a4a7a;margin-bottom:12px;">By ${post.authorName || 'ZISHU TRON'} · Published: ${date} ${updated ? '· Updated: '+updated : ''}</div>
          <div class="full-article-content">${post.content?.replace(/\n/g, '<br>') || ''}</div>`;
      }

      function loadPosts() {
        const ref = db.ref('posts').orderByChild('createdAt').limitToLast(50);
        ref.on('value', (snap) => {
          const data = snap.val();
          if (!data) { allPosts = []; postsFeed.innerHTML = ''; emptyFeed.classList.remove('hidden'); return; }
          allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
          emptyFeed.classList.add('hidden');
          renderFeed(allPosts);
        });
      }

      function renderFeed(posts) {
        if (!posts || posts.length === 0) { postsFeed.innerHTML = ''; emptyFeed.classList.remove('hidden'); return; }
        emptyFeed.classList.add('hidden');
        postsFeed.innerHTML = posts.map(p => renderPostCard(p, p.id)).join('');
      }

      function performSearch(query) {
        searchQuery = query.trim();
        if (!searchQuery) {
          searchResultsFull.innerHTML = `<div class="search-empty"><h4>Type to search</h4><p>Search articles by title or content</p></div>`;
          return;
        }
        const q = searchQuery.toLowerCase();
        const filtered = allPosts.filter(p => 
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q))
        );
        if (filtered.length === 0) {
          searchResultsFull.innerHTML = `<div class="search-empty"><h4>No results found</h4><p>Try searching with a different keyword.</p></div>`;
        } else {
          searchResultsFull.innerHTML = filtered.map(p => renderSearchResult(p, p.id)).join('');
        }
      }

      function openArticle(postId) {
        const post = allPosts.find(p => p.id === postId);
        if (!post) { showToast('Article not found.'); return; }
        homePage.classList.add('hidden');
        articleView.classList.remove('hidden');
        searchSection.classList.remove('open');
        fullArticleContainer.innerHTML = renderFullArticle(post);
        $$('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        navHome.classList.add('active');
      }

      function goHome() {
        homePage.classList.remove('hidden');
        articleView.classList.add('hidden');
        searchSection.classList.remove('open');
        renderFeed(allPosts);
        $$('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        navHome.classList.add('active');
        searchInputFull.value = '';
        searchResultsFull.innerHTML = `<div class="search-empty"><h4>Type to search</h4><p>Search articles by title or content</p></div>`;
      }

      function openSearch() {
        searchSection.classList.add('open');
        searchInputFull.focus();
        $$('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        navSearch.classList.add('active');
        if (searchInputFull.value.trim()) {
          performSearch(searchInputFull.value);
        } else {
          searchResultsFull.innerHTML = `<div class="search-empty"><h4>Type to search</h4><p>Search articles by title or content</p></div>`;
        }
      }

      function closeSearch() {
        searchSection.classList.remove('open');
        searchInputFull.value = '';
        searchResultsFull.innerHTML = `<div class="search-empty"><h4>Type to search</h4><p>Search articles by title or content</p></div>`;
        $$('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        navHome.classList.add('active');
        if (!articleView.classList.contains('hidden')) {
          // stay
        } else {
          homePage.classList.remove('hidden');
        }
      }

      let searchTimeout;
      searchInputFull?.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(searchInputFull.value), 300);
      });

      navHome?.addEventListener('click', goHome);
      navSearch?.addEventListener('click', openSearch);
      closeSearchBtn?.addEventListener('click', closeSearch);
      $('#backFromArticle')?.addEventListener('click', goHome);

      document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-id]');
        if (!target) return;
        const id = target.dataset.id;
        if (target.classList.contains('btn-read') || target.closest('.post-card')) {
          e.preventDefault();
          openArticle(id);
        }
      });

      document.addEventListener('click', (e) => {
        const target = e.target.closest('.search-result-item');
        if (target) {
          const id = target.dataset.id;
          openArticle(id);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (searchSection.classList.contains('open')) {
            closeSearch();
          } else if (!articleView.classList.contains('hidden')) {
            goHome();
          }
        }
      });

      loadPosts();
      goHome();
    })();
  </script>
</body>
</html>
